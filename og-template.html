<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Precursor — OG image template (1200×630)</title>
<!-- ============================================================
     OG IMAGE TEMPLATE — screenshot the .og-card below at exactly
     1200×630 and save as og-image.png in the site root.
     In Chrome DevTools: set device to 1200×630, or screenshot the
     .og-card element. Matches the clean fintech identity.
============================================================ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#475569;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:Inter,system-ui,sans-serif}
  .og-card{
    width:1200px;height:630px;flex-shrink:0;position:relative;overflow:hidden;
    background:radial-gradient(900px 520px at 82% -10%,#163057,transparent 60%),linear-gradient(160deg,#0b1a2b,#0d2138);
    color:#fff;padding:72px 80px;display:flex;flex-direction:column;justify-content:space-between;
  }
  .og-top{display:flex;align-items:center;gap:14px}
  .og-mark{width:52px;height:52px;border-radius:13px;background:#fff;display:flex;align-items:flex-end;justify-content:center;gap:4px;padding:11px}
  .og-mark i{display:block;width:7px;border-radius:3px;background:#2563eb}
  .og-mark i:nth-child(1){height:14px;opacity:.55}
  .og-mark i:nth-child(2){height:24px;opacity:.8}
  .og-mark i:nth-child(3){height:32px}
  .og-brand{font-size:30px;font-weight:700;letter-spacing:-.02em}
  .og-brand span{color:#60a5fa}
  .og-eyebrow{display:inline-block;font-size:18px;font-weight:600;color:#93c5fd;background:rgba(37,99,235,.16);border:1px solid rgba(96,165,250,.35);padding:8px 18px;border-radius:999px;margin-bottom:26px}
  .og-h1{font-size:74px;font-weight:800;letter-spacing:-.035em;line-height:1.02;max-width:18ch}
  .og-h1 em{font-style:normal;color:#60a5fa}
  .og-sub{font-size:25px;color:rgba(255,255,255,.72);margin-top:24px;max-width:40ch;line-height:1.4}
  .og-foot{display:flex;align-items:center;gap:28px;font-size:20px;font-weight:600;color:rgba(255,255,255,.82)}
  .og-foot .chip{display:inline-flex;align-items:center;gap:9px}
  .og-foot svg{color:#34d399}
  .og-price{margin-left:auto;font-size:22px;font-weight:700;color:#fff;background:#2563eb;padding:12px 24px;border-radius:999px}
</style>
</head>
<body>
  <div class="og-card">
    <div class="og-top">
      <div class="og-mark"><i></i><i></i><i></i></div>
      <div class="og-brand">Precursor<span>.</span></div>
    </div>
    <div>
      <span class="og-eyebrow">Property due diligence · Victoria</span>
      <div class="og-h1">Know what you're buying <em>before you sign.</em></div>
      <div class="og-sub">Independent due diligence reports for Victorian buyers and developers — delivered in 24–72 hours.</div>
    </div>
    <div class="og-foot">
      <span class="chip"><svg width="22" height="22" viewBox="0 0 16 16" fill="none"><path d="M3.5 8.5l3 3 6-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>48-hr delivery</span>
      <span class="chip"><svg width="22" height="22" viewBox="0 0 16 16" fill="none"><path d="M3.5 8.5l3 3 6-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Money-back guarantee</span>
      <span class="og-price">From A$99</span>
    </div>
  </div>
</body>
</html>
